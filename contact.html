<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Harsh Gaur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main>
    <section>
      <div class="eyebrow-mono">get in touch</div>
      <h1>Say hello, whichever hat you're addressing.</h1>
      <p class="lede">Open to backend engineering roles and collaborations, and to anyone who wants to talk about some creative stuff.</p>
    </section>

    <section>
      <form id="contact-form" action="https://formsubmit.co/gaurharsh336@gmail.com" method="POST">
        <input id="message-payload" type="hidden" name="message">
        <input type="hidden" name="_subject" value="New website enquiry">
        <input id="reply-to" type="hidden" name="_replyto">
        <input type="hidden" name="_captcha" value="false">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" placeholder="Full name" required>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" placeholder="name@gmail.com" pattern="[a-zA-Z0-9._%+\-]+@gmail\.com" title="Enter a valid Gmail address ending in @gmail.com" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="user_message" placeholder="What's this about?" required></textarea>
        </div>
        <button class="btn" type="submit" disabled>Send message</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="linklist">
        <li><a href="mailto:gaurharsh336@gmail.com">gaurharsh336@gmail.com</a><span>Email</span></li>
        <li><a href="https://linkedin.com/in/harsh-gaur" target="_blank" rel="noopener noreferrer">Harsh-Gaur</a><span>LinkedIn</span></li>
      </ul>
    </section>
  </main>
</div>
<script src="sidebar.js"></script>
<script>
  const contactForm = document.querySelector('#contact-form');
  const sendButton = contactForm.querySelector('button[type="submit"]');

  const updateSendButton = () => {
    sendButton.disabled = !contactForm.checkValidity();
  };

  contactForm.addEventListener('input', updateSendButton);
  contactForm.addEventListener('change', updateSendButton);
  updateSendButton();

  contactForm.addEventListener('submit', (event) => {
    if (!contactForm.checkValidity()) {
      event.preventDefault();
      contactForm.reportValidity();
      return;
    }

    const formData = new FormData(contactForm);
    const name = formData.get('name');
    const email = formData.get('email');
    const message = formData.get('user_message');
    document.querySelector('#message-payload').value = `Message:\n${message}\n\nName: ${name}`;
    document.querySelector('#reply-to').value = email;
  });
</script>
</body>
</html>
