<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Harsh Gaur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main>
    <section>
      <div class="eyebrow-mono">get in touch</div>
      <h1>Say hello, whichever hat you're addressing.</h1>
      <p class="lede">Open to backend engineering roles and collaborations, and to anyone who wants to talk about some creative stuff.</p>
    </section>

    <section>
      <h2>Resume</h2>
      <div class="resume-upload">
        <div class="resume-shell">
          <iframe class="resume-preview" src="HarshGaur_Resume.pdf#toolbar=0&navpanes=0&scrollbar=0" title="Harsh Gaur resume preview"></iframe>
        </div>
        <a class="btn download-btn" href="HarshGaur_Resume.pdf" download>Download resume</a>
      </div>
    </section>

    <section>
      <form id="contact-form">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" placeholder="Full name" required>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" placeholder="name@company.com" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What's this about?" required></textarea>
        </div>
        <button class="btn" type="submit">Send message</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="linklist">
        <li><a href="mailto:gaurharsh336@gmail.com">gaurharsh336@gmail.com</a><span>Email</span></li>
        <li><a href="https://linkedin.com/in/harsh-gaur" target="_blank" rel="noopener noreferrer">Harsh-Gaur</a><span>LinkedIn</span></li>
      </ul>
    </section>
  </main>
</div>
<script src="sidebar.js"></script>
<script>
  document.querySelector('#contact-form').addEventListener('submit', (event) => {
    event.preventDefault();

    const form = event.currentTarget;
    const formData = new FormData(form);
    const name = formData.get('name');
    const email = formData.get('email');
    const message = formData.get('message');
    const subject = `Website enquiry from ${name}`;
    const body = `Name: ${name}\nEmail: ${email}\n\n${message}`;

    window.location.href = `mailto:gaurharsh336@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });
</script>
</body>
</html>
