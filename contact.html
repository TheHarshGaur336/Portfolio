<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="site-base" content="{{ site.baseurl }}">
<title>Contact — Harsh Gaur</title>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main class="contact-page">
    <section>
      <div class="eyebrow-mono">get in touch</div>
      <h1>Say hello, whichever hat you're addressing.</h1>
      <p class="lede">Open to backend engineering roles and collaborations, and to anyone who wants to talk about some creative stuff.</p>
    </section>

    <section>
      <form id="contact-form" action="https://formsubmit.co/deatheater338@gmail.com" method="POST">
        <input type="hidden" name="_next" value="{{ '/contact/?sent=1' | absolute_url }}">
        <input id="message-payload" type="hidden" name="message">
        <input type="hidden" name="_subject" value="New website enquiry">
        <input id="reply-to" type="hidden" name="_replyto">
        <input type="hidden" name="_captcha" value="false">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" placeholder="Full name" required>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="user_message" placeholder="What's this about?" required></textarea>
        </div>
        <button class="btn" type="submit" disabled>Send message</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        <p class="form-help">When sending succeeds, you’ll see a confirmation here.</p>
      </form>
    </section>

    <section>
      <h2>Socials</h2>
      <nav class="social-links" aria-label="Personal contact links">
        <a class="social-link mail-icon" href="mailto:gaurharsh336@gmail.com" aria-label="Email Harsh Gaur" title="Email Harsh Gaur"><svg class="mail-glyph" viewBox="0 0 24 20" aria-hidden="true"><path d="M2 2h20v16H2zM2 3l10 8L22 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
        <a class="social-link instagram-icon" href="https://www.instagram.com/harshgaur.hg/" target="_blank" rel="noopener noreferrer" aria-label="Harsh Gaur on Instagram" title="Instagram"><span class="instagram-glyph" aria-hidden="true"></span></a>
        <a class="social-link x-icon" href="https://x.com/HarshGaur336" target="_blank" rel="noopener noreferrer" aria-label="Harsh Gaur on X" title="X / Twitter">𝕏</a>
        <a class="social-link linkedin-icon" href="https://linkedin.com/in/harsh-gaur" target="_blank" rel="noopener noreferrer" aria-label="Harsh Gaur on LinkedIn" title="LinkedIn">in</a>
      </nav>
    </section>
  </main>
</div>
<script src="{{ '/sidebar.js' | relative_url }}"></script>
<script>
  const contactForm = document.querySelector('#contact-form');
  const sendButton = contactForm.querySelector('button[type="submit"]');
  const statusMessage = document.querySelector('#form-status');
  let isSending = false;
  let hasInteracted = false;

  const updateSendButton = () => {
    const isValid = contactForm.checkValidity();
    sendButton.disabled = isSending || !isValid;

    if (!hasInteracted || isSending) return;
    statusMessage.classList.remove('success');
    if (isValid) {
      statusMessage.classList.remove('error');
      statusMessage.textContent = '';
      return;
    }

    statusMessage.classList.add('error');
    const emailField = contactForm.querySelector('#email');
    statusMessage.textContent = emailField.value && !emailField.validity.valid
      ? 'Enter a valid email address.'
      : 'Complete all required fields to enable sending.';
  };

  if (new URLSearchParams(window.location.search).get('sent') === '1') {
    statusMessage.textContent = 'Thanks — your message was sent. I’ll be in touch.';
    statusMessage.classList.add('success');
  }

  const handleFormChange = () => {
    hasInteracted = true;
    updateSendButton();
  };

  contactForm.addEventListener('input', handleFormChange);
  contactForm.addEventListener('change', handleFormChange);
  updateSendButton();

  contactForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!contactForm.checkValidity()) {
      statusMessage.textContent = 'Please check the required fields and enter a valid email address.';
      statusMessage.classList.add('error');
      contactForm.reportValidity();
      return;
    }

    const formData = new FormData(contactForm);
    const name = formData.get('name');
    const email = formData.get('email');
    const message = formData.get('user_message');
    document.querySelector('#message-payload').value = `Message:\n${message}\n\nName: ${name}`;
    document.querySelector('#reply-to').value = email;
    isSending = true;
    statusMessage.classList.remove('success', 'error');
    statusMessage.textContent = 'Sending your message…';
    updateSendButton();

    try {
      const endpoint = contactForm.action.replace('https://formsubmit.co/', 'https://formsubmit.co/ajax/');
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(Object.fromEntries(new FormData(contactForm)))
      });
      const result = await response.json();
      if (!response.ok || String(result.success).toLowerCase() !== 'true') {
        throw new Error(result.message || 'The message service did not confirm the submission.');
      }

      contactForm.reset();
      isSending = false;
      hasInteracted = false;
      updateSendButton();
      statusMessage.classList.remove('error');
      statusMessage.classList.add('success');
      statusMessage.textContent = 'Thanks — your message was sent. I’ll be in touch.';
    } catch (error) {
      isSending = false;
      hasInteracted = false;
      updateSendButton();
      statusMessage.classList.remove('success');
      statusMessage.classList.add('error');
      statusMessage.textContent = 'Your message could not be sent. Please try again or email me directly.';
    }
  });
</script>
</body>
</html>
